# Temporary Phase 1 workflow. Remove after the lockfile is refreshed and validated.
# Runs only for the dedicated security-upgrade branch, never for arbitrary PR code.
name: Phase 1 Next.js security upgrade
on:
  push:
    branches:
      - fix/phase1-nextjs-security-1641

permissions:
  contents: write

jobs:
  refresh-lockfile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: regenerate Next.js 16.4.1 lockfile"
            git push
          fi
      - name: Install lockfile exactly
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
