name: Diagnose stuck Tropical Plants TLS (read-only)

on:
  push:
    branches:
      - diagnostics/pages-tls-stuck-20261024

permissions:
  contents: read
  pages: read

jobs:
  inspect-https:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read Pages certificate state from GitHub API
        shell: bash
        run: |
          set -uo pipefail
          base="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          for endpoint in "$base" "$base/health" "https://api.github.com/repos/cjblackthorn/cjblackthorn.github.io/pages"; do
            tmp="$(mktemp)"
            code=$(curl --silent --show-error --max-time 20 -o "$tmp" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$endpoint")
            echo "Endpoint: $endpoint (HTTP $code)"
            python3 - "$tmp" <<'PY'
          import json,sys
          try:
              obj=json.load(open(sys.argv[1]))
          except Exception as e:
              print("Could not parse API response:", str(e))
              sys.exit(0)
          if "https_certificate" in obj or "html_url" in obj:
              cert=obj.get("https_certificate") or {}
              print(json.dumps({
                  "cname":obj.get("cname"),
                  "https_enforced":obj.get("https_enforced"),
                  "html_url":obj.get("html_url"),
                  "pages_status":obj.get("status"),
                  "build_type":obj.get("build_type"),
                  "certificate":{key:cert.get(key) for key in ("state","description","domains","expires_at","deployed_at") if key in cert}
              },indent=2))
          elif "health" in obj or "domain" in obj:
              print(json.dumps(obj,indent=2)[:3500])
          else:
              print("API response:",obj.get("message","Nonstandard response") if isinstance(obj,dict) else "Unexpected JSON type")
          PY
            rm -f "$tmp"
          done
      - name: Independently resolve hostname and inspect TLS (never bypass validation)
        shell: bash
        run: |
          set -uo pipefail
          host="tropicals.blackthorn.enterprises"
          for resolver in 1.1.1.1 8.8.8.8; do
            echo "Resolver $resolver:"
            for kind in CNAME A AAAA CAA; do
              printf '%s: ' "$kind"
              dig @"$resolver" +short +time=3 +tries=1 "$host" "$kind" | tr '\n' ' '
              echo
            done
            echo "Parent-domain CAA:"
            dig @"$resolver" +short +time=3 +tries=1 blackthorn.enterprises CAA
          done
          echo "Certificate currently presented by host:"
          echo | timeout 15 openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>/dev/null | \
            openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 | head -n 22
          echo "Strict HTTPS result (no --insecure):"
          curl --silent --show-error --head --location --connect-timeout 7 --max-time 18 \
            --output /dev/null --write-out "http=%{http_code} final=%{url_effective} tls_verify=%{ssl_verify_result}\n" \
            "https://$host/" || true
          echo "Plain HTTP response and redirect chain:"
          curl --silent --show-error --max-time 18 --dump-header /tmp/http-headers \
            --output /dev/null --write-out "HTTP entry status=%{http_code} final=%{url_effective}\\n" \
            "http://$host/" || true
          grep -iE '^(HTTP/|location:)' /tmp/http-headers | head -n 16 || true
          echo "Official Pages project alias:"
          curl --silent --show-error --max-time 18 --head \
            "https://cjblackthorn.github.io/blackthorn-tropicals/" | grep -iE '^(HTTP/|location:)' | head -n 10 || true
          echo "Read-only diagnostic completed; no Pages/DNS settings modified."

      - name: Verify enforcement and redirects after admin change
        shell: bash
        run: |
          set -euo pipefail
          host="tropicals.blackthorn.enterprises"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" -o /tmp/pages-state.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/pages-state.json"))
          cert=x.get("https_certificate") or {}
          print("Pages HTTPS enforced:",x.get("https_enforced"))
          print("Pages certificate state:",cert.get("state"))
          assert x.get("https_enforced") is True, "GitHub Pages HTTPS enforcement not yet enabled"
          assert cert.get("state")=="approved", "Pages certificate not yet approved"
          PY
          # Keep redirect validation separate from the HTTPS content request.
          redirect=$(curl --silent --show-error --max-time 20 --max-redirs 0 \
            --output /dev/null --write-out '%{http_code}|%{redirect_url}' "http://$host/")
          echo "HTTP first hop: $redirect"
          case "$redirect" in
            "301|https://$host/"*|"302|https://$host/"*|"307|https://$host/"*|"308|https://$host/"*) ;;
            *) echo "Plain HTTP is not redirected to the HTTPS hostname" >&2; exit 1;;
          esac
          verified=$(curl --fail --silent --show-error --location --max-time 20 \
            --output /dev/null --write-out '%{http_code}|%{ssl_verify_result}|%{url_effective}' "https://$host/")
          echo "Verified HTTPS: $verified"
          case "$verified" in
            "200|0|https://$host/"*) ;;
            *) echo "HTTPS not verified" >&2; exit 1;;
          esac
          alias_redirect=$(curl --silent --show-error --max-time 20 --max-redirs 0 \
            --output /dev/null --write-out '%{http_code}|%{redirect_url}' \
            "https://cjblackthorn.github.io/blackthorn-tropicals/")
          echo "Pages alias first hop: $alias_redirect"
          case "$alias_redirect" in
            "301|https://$host/"*|"302|https://$host/"*|"307|https://$host/"*|"308|https://$host/"*) ;;
            *) echo "Pages alias did not redirect to secured custom domain" >&2; exit 1;;
          esac
          echo "PASS: GitHub Pages enforces HTTPS, custom-domain TLS validates, and redirects point to HTTPS."
