name: Verify Tropical Plants app

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'build/**'
      - 'db/**'
      - 'worker/**'
      - 'vite.config.ts'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'build/**'
      - 'db/**'
      - 'worker/**'
      - 'vite.config.ts'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies (block high or critical advisories)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build for production
        run: npm run build
