name: Test Tropical Plants static storefront interactions

on:
  push:
    branches:
      - main
      - test/quote-cart-resilience-20261024
    paths:
      - index.html
      - styles.css
      - script.js
      - scripts/test_quote_cart.cjs
      - .github/workflows/quote-cart-qa.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - script.js
      - scripts/test_quote_cart.cjs
      - .github/workflows/quote-cart-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cart-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned test-only Chromium runner outside repository
        run: |
          npm install --prefix /tmp/tropical-cart-test --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/tropical-cart-test/node_modules/.bin/playwright install chromium
      - name: Check static storefront JavaScript syntax
        run: |
          node --check script.js
          node --check scripts/test_quote_cart.cjs
      - name: Exercise cart/filter/persistence on localhost, no production writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/blackthorn-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          NODE_PATH=/tmp/tropical-cart-test/node_modules node scripts/test_quote_cart.cjs
